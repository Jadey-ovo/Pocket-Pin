name: Client quality checks

on:
  pull_request:
    paths:
      - 'pocket-pin-client/**'
      - '.github/workflows/client-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocket-pin-client
    steps:
      - name: Validate Conventional Commit pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|refactor|perf|docs|test|build|ci|chore|style|revert)(\([a-zA-Z0-9._/-]+\))?\!?:\ .+ ]]; then
            echo "Pull request title must follow Conventional Commits, for example: feat(editor): add pencil tool"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pocket-pin-client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
